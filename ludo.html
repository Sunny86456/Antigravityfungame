<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Dev Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.24), transparent 30%),
                radial-gradient(circle at top right, rgba(16, 185, 129, 0.16), transparent 26%),
                #070b17;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 28px 60px rgba(3, 7, 18, 0.55);
        }

        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* ── Pause button ────────────────────────────────────── */
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03)),
                rgba(30, 41, 84, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #f8fafc;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: background 0.2s, transform 0.15s;
            user-select: none;
        }

        #pause-btn:hover {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04)),
                rgba(45, 58, 117, 0.78);
            transform: scale(1.1);
        }

        #pause-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="ludo-canvas"></canvas>
        <!-- Pause / Resume button (wired by ludo-boot.js) -->
        <button id="pause-btn" title="Pause / Resume">⏸</button>
    </div>
    <script type="module" src="/src/ludo-boot.js"></script>
</body>

</html>
