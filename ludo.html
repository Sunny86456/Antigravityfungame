<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Dev Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            /* Slate 900 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            border-radius: 12px;
        }

        /* ── Pause button ────────────────────────────────────── */
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.15s;
            user-select: none;
        }

        #pause-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.1);
        }

        #pause-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="ludo-canvas"></canvas>
        <!-- Pause / Resume button (wired by ludo-boot.js) -->
        <button id="pause-btn" title="Pause / Resume">⏸</button>
    </div>
    <script type="module" src="/src/ludo-boot.js"></script>
</body>

</html>
